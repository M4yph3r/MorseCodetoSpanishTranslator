<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traductor Morse</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <div class="container">
        <h1>📡 Traductor Código Morse</h1>

        <div class="card">
            <h2>Español → Morse</h2>

            <textarea
                id="spanishInput"
                placeholder="Ingresa texto en español"></textarea>

            <button onclick="translateToMorse()">
                Traducir
            </button>

            <div class="result" id="morseResult"></div>
        </div>

        <div class="card">
            <h2>Morse → Español</h2>

            <textarea
                id="morseInput"
                placeholder="Ingresa código Morse"></textarea>

            <small>
                Usa espacios entre letras y tres espacios entre palabras
            </small>

            <button onclick="translateToText()">
                Traducir
            </button>

            <div class="result" id="textResult"></div>
        </div>
    </div>

    <script src="/js/app.js"></script>

</body>
</html>
